<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMAP降维示例</title>
</head>

<body>

  <script src="https://cdn.jsdelivr.net/npm/umap-js@latest/dist/umap.min.js"></script>
  <script>
    // 构建数据结构 (39)[Array(7), Array(7), Array(7),... Array(7)]，每个Array(7) 包含 [0, 1] 的数值
    const data = [];
    for (let i = 0; i < 39; i++) {
      const subArray = [];
      for (let j = 0; j < 7; j++) {
        subArray.push(Math.random() > 0.5 ? 0 : 1);
      }
      data.push(subArray);
    }

    // 设置UMAP参数
    const umapOptions = {
      epsilon: 5,
      perplexity: 20,
      dim: 2
    };

    // 创建UMAP实例
    const umap = new umap - js.UMAP(umapOptions);

    // 对数据进行拟合（降维）
    const embedding = umap.fit(data);

    // 输出降维后的结果
    console.log(embedding);
  </script>

</body>

</html>
